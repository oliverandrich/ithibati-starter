name: Integration
# Generates real applications from the templates. It runs only where a change can reach them.
on:
  pull_request:
    paths:
      - "lib/**"
      - "priv/**"
      - "installer/**"
      - "scripts/integration.sh"
      - "mix.exs"
      - "mix.lock"
      - "mise.toml"
      - ".github/workflows/integration.yml"
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "priv/**"
      - "installer/**"
      - "scripts/integration.sh"
      - "mix.exs"
      - "mix.lock"
      - "mise.toml"
      - ".github/workflows/integration.yml"
  workflow_dispatch:
    inputs:
      profiles:
        description: "Profiles to generate"
        default: "mit agpl"
        type: string
  workflow_call:
    inputs:
      profiles:
        default: "mit agpl"
        type: string
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  # A run on a tag is the release gate, which a newer run must not cancel.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # A push or pull request runs one profile. A manual run and the release run both.
      PROFILES: ${{ inputs.profiles || 'agpl' }}
      # The image check runs where the profiles were named: a manual run and the release.
      INTEGRATION_IMAGE: ${{ inputs.profiles && 'true' || 'false' }}
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          cache: ${{ github.ref_type != 'tag' }}
      - run: mix deps.get --check-locked
      # The template's lockfile pins playwright, and each playwright version pins its browser build.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ github.ref_type != 'tag' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('priv/templates/auth/assets/package-lock.json.tpl') }}
      # The generated applications run Playwright's headless Chrome, which needs these libraries.
      # The version comes from the template, so the two cannot drift apart.
      - run: npx -y "playwright@$(jq -r '.devDependencies.playwright' priv/templates/auth/assets/package.json.tpl)" install-deps chromium
      - run: |
          read -ra profiles <<<"$PROFILES"
          mise run integration "${profiles[@]}"
