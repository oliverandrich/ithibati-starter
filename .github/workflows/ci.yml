name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this gate on its tag, without caches, because that result ships.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A run on a tag is the release gate, which a newer run must not cancel.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: ${{ github.ref_type != 'tag' }}
      - if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mise.toml', 'mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mise run check
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          cache: ${{ github.ref_type != 'tag' }}
      - run: mix deps.get --check-locked
      # The template's lockfile pins playwright, and each playwright version pins its browser build.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ github.ref_type != 'tag' }}
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('priv/templates/auth/assets/package-lock.json.tpl') }}
      # The generated applications run Playwright's headless Chrome, which needs these libraries.
      # The version comes from the template, so the two cannot drift apart.
      - run: npx -y "playwright@$(jq -r '.devDependencies.playwright' priv/templates/auth/assets/package.json.tpl)" install-deps chromium
      - run: mise run integration
