name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this gate on its tag, without caches, because that result ships.
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A run on a tag is the release gate, which a newer run must not cancel.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          cache: ${{ github.ref_type != 'tag' }}
      - if: ${{ github.ref_type != 'tag' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ env.MIX_ENV }}-${{ hashFiles('mise.toml', 'mix.lock') }}
      - run: mix deps.get --check-locked
      - run: mise run check
